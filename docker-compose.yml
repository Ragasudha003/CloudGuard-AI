services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cloudguard-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend/cloudguard.db:/app/cloudguard.db
      - ./backend/cloudguard_backup.db:/app/cloudguard_backup.db

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: cloudguard-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped